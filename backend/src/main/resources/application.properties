spring.application.name=finance-ai

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

servicio.ia.url=http://localhost:8000
servicio.ia.connect-timeout-ms=${IA_CONNECT_TIMEOUT_MS:2000}
servicio.ia.read-timeout-ms=${IA_READ_TIMEOUT_MS:12000}

# Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/hackathon_finance_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret (mínimo 256 bits / 32 caracteres)
api.security.token.secret=MiSecretoSuperSeguroParaLaHackathon2026FinanceAI